services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
        POSTGRES_DB: url_shortner
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 2007
    ports:
       -  "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql/data
  redis:
   image: redis:7
   container_name: redis-cache
   ports:
    - "6379:6379"
  app:
   build: .
   container_name: url-shortner-app
   ports:
        - "8080:8080"
   depends_on:
      - postgres
      - redis
   environment:
      DB_USERNAME: postgres
      DB_PASSWORD: 2007
 
volumes:
   postgres_data: