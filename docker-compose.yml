services:
  postgres:
    image: postgres-16
    container_name: postgres-db
    environment:
        POSTGRES_DB: url_shortner
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 2002
    ports:
       -  "5432:5432"
  redis:
   image: redis:7
   container_name: redis-cache
   ports:
    - "6379:6379"
	
  app:
   build: .
   container_name: url-shortner-app
   ports:
        - "8080:8080"
   depends_on:
      - postgres
      - redis	